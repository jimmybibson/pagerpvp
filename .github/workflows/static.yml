<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Terminal</title>
    <style>
        * {
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .stats-top {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 3;
            font-size: 18px;
            color: #0f0;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
            letter-spacing: 2px;
        }

        .stat-left {
            text-align: left;
        }

        .stat-right {
            text-align: right;
        }

        .stats-bottom {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }

        .stat-center {
            text-align: center;
            font-size: 18px;
            color: #0f0;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
            letter-spacing: 2px;
        }

        .stat-version {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 14px;
            color: #0a0;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
            letter-spacing: 1px;
            z-index: 3;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
        }

        .access-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .access-text {
            font-size: 48px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
            letter-spacing: 8px;
        }

        .icon-container {
            display: flex;
            gap: 60px;
            align-items: center;
        }

        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            padding: 20px;
            border: 2px solid transparent;
            border-radius: 10px;
        }

        .icon-wrapper:hover {
            border-color: #0f0;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            transform: scale(1.1);
        }

        .icon-wrapper svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.3));
        }

        .icon-wrapper .icon-img {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.3));
        }

        .roblox-icon-svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.3));
        }

        .icon-label {
            color: #0f0;
            font-size: 16px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
        }

        .auth-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .auth-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        .auth-overlay.closing {
            animation: fadeOut 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        /* Discord Login Styling */
        .discord-login {
            position: relative;
            width: 90%;
            max-width: 480px;
            padding: 32px;
            background: #36393f;
            border-radius: 8px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,.2);
            transform: scale(0.9);
            opacity: 0;
            animation: scaleIn 0.3s ease 0.1s forwards;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #discordOverlay {
            background: url('https://discord.com/assets/4e3521eb4d7c5cd2ebc3.svg') center/cover, #5865f2;
        }

        #passwordOverlay {
            background: url('https://discord.com/assets/4e3521eb4d7c5cd2ebc3.svg') center/cover, #5865f2;
        }

        .discord-link {
            color: #00aff4;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 20px;
            cursor: pointer;
            text-align: left;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: text-decoration 0.2s;
        }

        .discord-link:hover {
            text-decoration: underline;
        }

        .close-btn-white {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #b9bbbe;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
            font-weight: 300;
            line-height: 1;
        }

        .close-btn-white:hover {
            color: #fff;
        }

        .discord-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }

        .discord-title {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .discord-subtitle {
            color: #b9bbbe;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .discord-input-group {
            margin-bottom: 20px;
        }

        .discord-label {
            display: block;
            color: #b9bbbe;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .discord-input {
            width: 100%;
            padding: 10px;
            background: #202225;
            border: 1px solid #202225;
            border-radius: 3px;
            color: #dcddde;
            font-size: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: border-color 0.2s;
        }

        .discord-input:focus {
            outline: none;
            border-color: #00aff4;
        }

        .discord-button {
            width: 100%;
            padding: 12px;
            background: #5865f2;
            border: none;
            border-radius: 3px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin-top: 20px;
        }

        .discord-button:hover {
            background: #4752c4;
        }

        .discord-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .discord-message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 3px;
            text-align: center;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .discord-message.show {
            display: block;
        }

        .discord-message.success-message {
            background: #3ba55d;
            color: #fff;
        }

        .discord-message.error-message {
            background: #ed4245;
            color: #fff;
        }

        /* Roblox Login Styling */
        .roblox-login {
            position: relative;
            width: 90%;
            max-width: 400px;
            padding: 40px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transform: scale(0.9);
            opacity: 0;
            animation: scaleIn 0.3s ease 0.1s forwards;
        }

        #robloxOverlay {
            background: linear-gradient(180deg, #00a2ff 0%, #0074bd 100%);
        }

        .roblox-logo-center {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .close-btn-dark {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #666;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
            font-weight: 300;
            line-height: 1;
        }

        .close-btn-dark:hover {
            color: #000;
        }

        .roblox-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .roblox-title {
            color: #393b3d;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 32px;
            font-family: 'HCo Gotham SSm', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .roblox-input-group {
            margin-bottom: 16px;
        }

        .roblox-input {
            width: 100%;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #c3c3c3;
            border-radius: 4px;
            color: #393b3d;
            font-size: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: border-color 0.2s;
        }

        .roblox-input:focus {
            outline: none;
            border-color: #00a2ff;
        }

        .roblox-button {
            width: 100%;
            padding: 14px;
            background: #00a2ff;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin-top: 8px;
        }

        .roblox-button:hover {
            background: #0074bd;
        }

        .roblox-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .roblox-message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .roblox-message.show {
            display: block;
        }

        .roblox-message.success-message {
            background: #02b757;
            color: #fff;
        }

        .roblox-message.error-message {
            background: #ff4c4c;
            color: #fff;
        }

        .auth-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border: 2px solid #0f0;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        .overlay-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #0f0;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
            letter-spacing: 4px;
        }

        .form-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-wrapper form {
            width: 100%;
        }

        .alt-link {
            color: #0f0;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            line-height: 1.6;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.7;
        }

        .alt-link:hover {
            opacity: 1;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        .roblox-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }

        .roblox-overlay.active {
            display: flex;
        }

        .roblox-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border: 2px solid #0f0;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #0f0;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
        }

        .close-btn:hover {
            color: #f00;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
            transform: rotate(90deg);
        }

        .overlay-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #0f0;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
            letter-spacing: 4px;
        }

        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .divider {
            width: 2px;
            background: linear-gradient(to bottom, transparent, #0f0, transparent);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            align-self: stretch;
        }

        .alt-text {
            color: #0f0;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            line-height: 1.6;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-section form {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .title {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            color: #0f0;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
            letter-spacing: 8px;
            animation: wobble 2s ease-in-out infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            resize: none;
            height: 50px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
            border-color: #0ff;
        }

        textarea::placeholder {
            color: #0a0;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        button:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
            border-color: #0ff;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #0f0;
            color: #0f0;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .success-message.show {
            display: block;
            animation: pulse 0.5s ease;
        }

        .error-message {
            display: none;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #f00;
            color: #f00;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .error-message.show {
            display: block;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="stats-top">
        <div class="stat-left">KILLS: 0</div>
        <div class="stat-right">SCORE: 0</div>
    </div>
    
    <div class="stats-bottom">
        <div class="stat-center">KILLSTREAK: 0</div>
    </div>
    
    <div class="stat-version">VERSION 1.4.3</div>
    
    <canvas id="matrix-canvas"></canvas>
    
    <div class="container">
        <div class="title">PAGER PVP</div>
        
        <div class="access-section">
            <div class="access-text">ACCESS?</div>
            <div class="icon-container">
                <div class="icon-wrapper" id="discordIcon">
                    <svg viewBox="0 0 71 55" fill="none" xmlns="http://www.w3.org/2000/svg">
